# Secrets in the fork: GALLERY_KEYSTORE_BASE64, GALLERY_KEYSTORE_PASSWORD, GALLERY_KEY_ALIAS,
# GALLERY_KEY_PASSWORD (from ~/Desktop/repos/gallery-signing) and APK_DEPLOY_SECRET (same value as on morgenschiss).
name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0
      - name: Prepare signing key
        env:
          GALLERY_KEYSTORE_BASE64: ${{ secrets.GALLERY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GALLERY_KEYSTORE_BASE64" ]; then
            echo "$GALLERY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gallery.jks"
            echo "GALLERY_KEYSTORE_FILE=$RUNNER_TEMP/gallery.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        # release, not debug: a debug build without R8 can pass Cloudflare's 100 MB upload limit
        working-directory: Android/src
        env:
          GALLERY_KEYSTORE_PASSWORD: ${{ secrets.GALLERY_KEYSTORE_PASSWORD }}
          GALLERY_KEY_ALIAS: ${{ secrets.GALLERY_KEY_ALIAS }}
          GALLERY_KEY_PASSWORD: ${{ secrets.GALLERY_KEY_PASSWORD }}
        run: GALLERY_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER)) ./gradlew assembleRelease
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Android/src/app/build/outputs/apk/release/*.apk | grep -i "SHA-256"
      - name: Deploy APK to morgenschiss
        # PR builds only check that the app compiles; phones get it after the merge.
        if: github.event_name == 'push'
        env:
          APK_DEPLOY_SECRET: ${{ secrets.APK_DEPLOY_SECRET }}
        run: |
          if [ -z "$APK_DEPLOY_SECRET" ]; then echo "APK_DEPLOY_SECRET not set - skipping deploy."; exit 0; fi
          # an APK signed with any other key cannot update the installed app
          if [ -z "$GALLERY_KEYSTORE_FILE" ]; then echo "No stable signing key - not deploying."; exit 1; fi
          APK_PATH=$(find Android/src/app/build/outputs/apk/release -name '*.apk' | head -1)
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' Android/src/app/build.gradle.kts)
          curl -sf -X POST \
            "https://morgenschiss.de/api/mediasearch/apk-upload?versionCode=${VERSION_CODE}&versionName=${VERSION_NAME}" \
            -H "x-apk-deploy-secret: ${APK_DEPLOY_SECRET}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_PATH"
