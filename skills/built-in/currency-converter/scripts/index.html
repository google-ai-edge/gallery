    function normalizeCurrency(input) {
      if (!input || typeof input !== 'string') return '';
      const clean = input.trim().toUpperCase();

      if (SYMBOL_TO_CODE[clean]) return SYMBOL_TO_CODE[clean];
      if (NAME_TO_CODE[clean]) return NAME_TO_CODE[clean];

      // Remove non-alphanumeric
      const alphaOnly = clean.replace(/[^A-Z]/g, '');
      if (NAME_TO_CODE[alphaOnly]) return NAME_TO_CODE[alphaOnly];

      if (alphaOnly.length === 3) return alphaOnly;
      return clean;
    }

    function parseAmount(amountInput) {
      if (typeof amountInput === 'number') {
        return isNaN(amountInput) || amountInput < 0 ? 1 : amountInput;
      }
      if (typeof amountInput === 'string') {
        const sanitized = amountInput.replace(/[^0-9.-]/g, '');
        const parsed = parseFloat(sanitized);
        return isNaN(parsed) || parsed < 0 ? 1 : parsed;
      }
      return 1;
    }

    async function fetchWithTimeout(url, timeoutMs = 4000) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function getExchangeRate(from, to) {
      // 1. Primary: open.er-api.com
      try {
        const data = await fetchWithTimeout(`https://open.er-api.com/v6/latest/${from}`, 4000);
        if (data && data.rates && data.rates[to] !== undefined) {
          const rate = data.rates[to];
          const date = data.time_last_update_utc ? new Date(data.time_last_update_utc).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : new Date().toISOString().split('T')[0];
          return { rate, date, source: 'Live Market Rate' };
        }
      } catch (err) {
        console.warn('Primary exchange rate API failed:', err.message);
      }

      // 2. Secondary: Frankfurter API (ECB rates)
      try {
        const data = await fetchWithTimeout(`https://api.frankfurter.app/latest?from=${from}&to=${to}`, 3500);
        if (data && data.rates && data.rates[to] !== undefined) {
          const rate = data.rates[to];
          return { rate, date: data.date || new Date().toISOString().split('T')[0], source: 'ECB Reference Rate' };
        }
      } catch (err) {
        console.warn('Secondary exchange rate API failed:', err.message);
      }

      // 3. Tertiary: Offline cache fallback
      const fromUsd = OFFLINE_RATES_BASE_USD[from];
      const toUsd = OFFLINE_RATES_BASE_USD[to];
      if (fromUsd !== undefined && toUsd !== undefined) {
        const rate = toUsd / fromUsd;
        return {
          rate,
          date: 'Baseline Reference',
          source: 'Offline Fallback Rate'
        };
      }

      throw new Error(`Unsupported currency pair: ${from} to ${to}`);
    }

    function formatNumber(num) {
      if (num === 0) return '0.00';
      if (num >= 1000) {
        return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      if (num >= 1) {
        return num.toFixed(2);
      }
      if (num >= 0.0001) {
        return num.toFixed(4);
      }
      return num.toFixed(6);
    }

    window['ai_edge_gallery_get_result'] = async (dataStr) => {
      try {
        let input = {};
        if (dataStr) {
          input = typeof dataStr === 'string' ? JSON.parse(dataStr) : dataStr;
        }

        const amount = parseAmount(input.amount !== undefined ? input.amount : 1);
        let from = normalizeCurrency(input.from || 'USD');
        let to = normalizeCurrency(input.to || (from === 'USD' ? 'EUR' : 'USD'));

        if (!from) from = 'USD';
        if (!to) to = 'EUR';

        // Same currency trivial case
        if (from === to) {
          const formattedAmount = formatNumber(amount);
          const resultText = `${formattedAmount} ${from} = ${formattedAmount} ${to} (Exchange Rate: 1.0000)`;
          const webviewUrl = `webview.html?amount=${amount}&from=${from}&to=${to}&result=${amount}&rate=1&date=${encodeURIComponent('Current')}&source=${encodeURIComponent('Direct')}`;
          return JSON.stringify({
            result: resultText,
            webview: {
              url: webviewUrl,
              aspectRatio: 1.15
            }
          });
        }

        const { rate, date, source } = await getExchangeRate(from, to);
        const converted = amount * rate;
        const inverseRate = 1 / rate;

        const formattedFromAmount = formatNumber(amount);
        const formattedConverted = formatNumber(converted);
        const formattedRate = formatNumber(rate);
        const formattedInverse = formatNumber(inverseRate);

        const resultText = `${formattedFromAmount} ${from} = ${formattedConverted} ${to} (Exchange Rate: 1 ${from} = ${formattedRate} ${to}, 1 ${to} = ${formattedInverse} ${from} | Date: ${date} | Source: ${source})`;

        const webviewUrl = `webview.html?amount=${encodeURIComponent(amount)}&from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&result=${encodeURIComponent(converted)}&rate=${encodeURIComponent(rate)}&date=${encodeURIComponent(date)}&source=${encodeURIComponent(source)}`;

        return JSON.stringify({
          result: resultText,
          webview: {
            url: webviewUrl,
            aspectRatio: 1.15
          }
        });
      } catch (e) {
        console.error('Currency conversion error:', e);
        return JSON.stringify({
          error: `Currency conversion failed: ${e.message}`
        });
      }
    };
