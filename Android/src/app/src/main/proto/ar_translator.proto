syntax = "proto3";

package com.google.ai.edge.gallery.proto;

option java_package = "com.google.ai.edge.gallery.proto";
option java_multiple_files = true;

enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_ENGLISH = 1;
  LANGUAGE_CHINESE = 2;
  LANGUAGE_FRENCH = 3;
  LANGUAGE_SPANISH = 4;
  LANGUAGE_KOREAN = 5;
  LANGUAGE_HINDI = 6;
  LANGUAGE_JAPANESE = 7;
  LANGUAGE_GERMAN = 8;
  LANGUAGE_ITALIAN = 9;
  LANGUAGE_PORTUGUESE = 10;
  LANGUAGE_THAI = 11;
  LANGUAGE_VIETNAMESE = 12;
  LANGUAGE_ARABIC = 13;
  LANGUAGE_RUSSIAN = 14;
}

message DictionaryEntry {
  string word = 1;
  string translation = 2;
  Language main_language = 3;
  Language learn_language = 4;
  string target_sentence = 5;
  string native_sentence = 6;
  string definition = 7;
  // Whether foreground sticker segmentation was already attempted for the
  // word's photo, so that it is not segmented again when it had no foreground
  // object. The sticker cutout itself is saved as a PNG file next to the photo.
  bool sticker_segmentation_attempted = 8;
}

message Dictionary {
  repeated DictionaryEntry entries = 1;
  Language main_language = 2;
  Language learn_language = 3;
  string selected_persona = 4;
}

// A vocabulary card generated by the teacher during a lesson session, stored
// with the session history so it can be saved to the dictionary later. Unlike
// a DictionaryEntry, it is not a saved word.
message VocabCardProto {
  // The word or short phrase in the learn language.
  string word = 1;
  // The meaning of the word in the main language.
  string meaning = 2;
  // An example sentence in the learn language.
  string example = 3;
  // The translation of the example sentence in the main language.
  string example_translation = 4;
  // The student's main (native) language when the card was generated.
  Language main_language = 5;
  // The language being learned when the card was generated.
  Language learn_language = 6;
}
