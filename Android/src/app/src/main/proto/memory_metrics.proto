syntax = "proto3";

package com.google.ai.edge.gallery.common.metrics;

option java_multiple_files = true;
option java_package = "com.google.ai.edge.gallery.common.metrics";

// Memory consumption metrics during inference.
message MemoryMetrics {
  // Peak memory consumed during the turn in megabytes (MB).
  optional float peak_memory_mb = 1;
  // Average memory consumed across sampled intervals in megabytes (MB).
  optional float average_memory_mb = 2;
}
