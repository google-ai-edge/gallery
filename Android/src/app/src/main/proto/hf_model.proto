syntax = "proto3";

package com.google.ai.edge.gallery.proto;

option java_multiple_files = true;
option java_package = "com.google.ai.edge.gallery.proto";

message HfSiblingProto {
  string rfilename = 1;
  // Size of the file in bytes. This field is not present in the models search
  // API (/api/models), and is set in the model details API
  // (/api/models/{model_id}?blobs=true).
  int64 size = 2;
}

enum HfSortOptionProto {
  HF_SORT_OPTION_UNSPECIFIED = 0;
  HF_SORT_OPTION_DOWNLOADS = 1;
  HF_SORT_OPTION_LIKES = 2;
  HF_SORT_OPTION_RECENT = 3;
}

message HfModelItemProto {
  string id = 1;
  string author = 2;
  string description = 3;
  int64 downloads = 4;
  int64 likes = 5;
  repeated string tags = 6;
  string last_modified = 7;
  repeated HfSiblingProto siblings = 8;
}
