syntax = "proto3";

package com.google.ai.edge.gallery.common.metrics;

option java_multiple_files = true;
option java_package = "com.google.ai.edge.gallery.common.metrics";

// Battery power consumption metrics during inference.
message BatteryMetrics {
  // Peak instantaneous power draw in milliwatts (mW).
  optional float peak_power_mw = 1;
  // Average power draw across sampled intervals in milliwatts (mW).
  optional float average_power_mw = 2;
}
