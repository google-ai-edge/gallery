syntax = "proto3";

package com.google.ai.edge.gallery.proto;

option java_package = "com.google.ai.edge.gallery.proto";
option java_outer_classname = "OnboardingProto";
option java_multiple_files = true;

// Data structure for persisting onboarding completion states across features.
message OnboardingData {
  // Map of feature ID to a boolean indicating whether the user has completed or
  // dismissed onboarding for that feature.
  map<string, bool> visited_feature_ids = 1;
}
